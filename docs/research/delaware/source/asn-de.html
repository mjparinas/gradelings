  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="../../">Home</a></li>
        <li class="breadcrumb-item"><a href="../ASNJurisdiction">Browse Standards</a></li>
        <li class="breadcrumb-item active" aria-current="page">Delaware</li>
      </ol>
    </nav>
    <div class="container py-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1>Delaware</h1>
        <div class="ms-3" style="min-width: 240px;">
          <input id="searchInput" type="search" class="form-control" placeholder="Find…" aria-label="Find" />
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover table-striped table-bordered align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="sticky-header">Title</th>
                  <th scope="col" class="sticky-header">Year</th>
                  <th scope="col" class="sticky-header">Status</th>
                  <th scope="col" class="sticky-header">Download</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <!-- Rows will be injected by JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer d-flex flex-wrap align-items-center gap-2 justify-content-between">
          <div class="text-muted" id="pageInfo" aria-live="polite"></div>
          <nav aria-label="Table pagination">
            <ul class="pagination mb-0" id="pagination">
              <!-- Pagination buttons will be injected -->
            </ul>
          </nav>
        </div>
      </div>
    </div>
    <script>
      const STATES = [{"title":"Delaware Standards for Civics","status":"Published","year":"2018","link":"D21189430"},{"title":"Delaware Standards for History","status":"Published","year":"2018","link":"D21189378"},{"title":"Delaware Financial Literacy Standards","status":"Published","year":"2018","link":"D21072650"},{"title":"Delaware Standards for Economics","status":"Published","year":"2018","link":"D21189461"},{"title":"Delaware Standards for Geography","status":"Published","year":"2018","link":"D21189484"},{"title":"Next Generation Science Standards","status":"Published","year":"2013","link":"D2603111"},{"title":"Delaware Geography Standards","status":"Published","year":"2010","link":"D10003EB"},{"title":"Delaware Civics Standards","status":"Published","year":"2010","link":"D10003ED"},{"title":"Delaware History Standards","status":"Published","year":"2010","link":"D10003EE"},{"title":"Delaware Economics Standards","status":"Published","year":"2010","link":"D10003EC"},{"title":"Common Core State Standards for English Language Arts & Literacy in History/Social Studies, Science, and Technical Subjects","status":"Published","year":"2010","link":"D2548174"},{"title":"Delaware Personal Finance Standards","status":"Published","year":"2010","link":"D2509533"},{"title":"Common Core State Standards for Mathematics","status":"Published","year":"2010","link":"D2547470"},{"title":"Mathematics Standards and GLEs K-8","status":"Deprecated","year":"2008","link":"D100037B"},{"title":"Mathematics Standards and GLEs 9-12","status":"Deprecated","year":"2008","link":"D100037C"},{"title":"Delaware Physical Education Standards","status":"Published","year":"2008","link":"D2509318"},{"title":"Delaware Health Education Standards","status":"Published","year":"2008","link":"D2508951"},{"title":"Delaware Health Education Standards","status":"Deprecated","year":"2008","link":"D2404399"},{"title":"Delaware Music Content Standards and Grade Level Expectations","status":"Published","year":"2007","link":"D10002DE"},{"title":"Delaware Technology Education Standards","status":"Published","year":"2007","link":"D2589285"},{"title":"Delaware Theatre Content Standards and Grade Level Expectations","status":"Published","year":"2007","link":"D10002DF"},{"title":"Delaware Visual Art Content Standards and Grade Level Expectations","status":"Published","year":"2007","link":"D10002E0"},{"title":"Delaware Dance Content Standards and Grade Level Expectations","status":"Published","year":"2007","link":"D10002DD"},{"title":"Delaware Science Grade Level Expectations","status":"Deprecated","year":"2006","link":"D2507858"},{"title":"Social Studies Grade Level Expectations","status":"Deprecated","year":"2006","link":"D1000298"},{"title":"Delaware Math Grade-Level Expectations","status":"Deprecated","year":"2006","link":"D1000260"},{"title":"Delaware English Standards and Grade Level Expectations","status":"Deprecated","year":"2006","link":"D1000296"},{"title":"Delaware Science Content Standards","status":"Deprecated","year":"2006","link":"D100025F"},{"title":"State of Delaware Science Curriculum Framework","status":"Deprecated","year":"1995","link":"D100017E"},{"title":"Delaware Mathematics Curriculum Framework","status":"Deprecated","year":"1995","link":"D1000205"},{"title":"State of Delaware English Language Arts Curriculum Framework","status":"Deprecated","year":"1995","link":"D1000011"}];
      const PAGE_SIZE = 10;
      const tbody = document.getElementById("tableBody");
      const pagination = document.getElementById("pagination");
      const pageInfo = document.getElementById("pageInfo");
      const searchInput = document.getElementById("searchInput");
      let currentPage = 1;
      let filtered = [...STATES];
      function paginate(arr, page, pageSize) {
        const start = (page - 1) * pageSize;
        return arr.slice(start, start + pageSize);
      }
      function renderTable() {
        const pageItems = paginate(filtered, currentPage, PAGE_SIZE);
        tbody.innerHTML = "";
        if (pageItems.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="text-center text-muted py-4">
                No results found.
              </td>
            </tr>`;
          return;
        }
        pageItems.forEach((s, idx) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><a href="../../resources/${s.link}">${s.title}</a></td>
            <td>${s.year}</td>
            <td>${s.status}</td>
            <td class="text-center align-middle">
              <div class="d-flex justify-content-center align-items-center gap-3">
                <a href="/resources/${s.link}_full.xml" download class="link-primary" title="Download XML">
                  <i class="bi bi-filetype-xml" style="font-size: 1.25rem;"></i>
                </a>
                <a href="/resources/${s.link}_full.json" download class="link-success" title="Download JSON">
                  <i class="bi bi-filetype-json" style="font-size: 1.25rem;"></i>
                </a>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
      function renderPagination() {
        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        currentPage = Math.min(currentPage, totalPages);
        function createPageItem({ label, page, disabled = false, active = false, ariaLabel }) {
          const li = document.createElement("li");
          li.className = `page-item${active ? " active" : ""}${disabled ? " disabled" : ""}`;
          const a = document.createElement("a");
          a.className = "page-link";
          a.href = "#";
          a.innerText = label;
          if (ariaLabel) a.setAttribute("aria-label", ariaLabel);
          if (!disabled && !active) {
            a.onclick = (e) => {
              e.preventDefault();
              currentPage = page;
              renderTable();
              renderPagination();
              updatePageInfo();
            };
          }
          li.appendChild(a);
          return li;
        }
        pagination.innerHTML = "";
        pagination.appendChild(createPageItem({ label: "«", page: 1, disabled: currentPage === 1, ariaLabel: "First" }));
        pagination.appendChild(createPageItem({ label: "‹", page: currentPage - 1, disabled: currentPage === 1, ariaLabel: "Previous" }));
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
            pagination.appendChild(createPageItem({ label: i, page: i, active: i === currentPage }));
          } else if (i === currentPage - 3 || i === currentPage + 3) {
            const li = document.createElement("li");
            li.className = "page-item disabled";
            li.innerHTML = '<span class="page-link">…</span>';
            pagination.appendChild(li);
          }
        }
        pagination.appendChild(createPageItem({ label: "›", page: currentPage + 1, disabled: currentPage === totalPages, ariaLabel: "Next" }));
        pagination.appendChild(createPageItem({ label: "»", page: totalPages, disabled: currentPage === totalPages, ariaLabel: "Last" }));
      }
      function updatePageInfo() {
        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        const start = (currentPage - 1) * PAGE_SIZE + 1;
        const end = Math.min(currentPage * PAGE_SIZE, filtered.length);
        pageInfo.textContent = `Showing ${start}-${end} of ${filtered.length}`;
      }
      searchInput.addEventListener("input", function () {
        const q = this.value.trim().toLowerCase();
        filtered = STATES.filter(s => s.title.toLowerCase().includes(q));
        currentPage = 1;
        renderTable();
        renderPagination();
        updatePageInfo();
      });
      renderTable();
      renderPagination();
      updatePageInfo();
    </script>
    <hr>

    <script src="/scripts/footer.js"></script>
