# One-off: copies the Kokoro model, tokenizer and voices from the Hugging Face revision pinned in
# src/lib/kokoro-manifest.json (the hashes) to the kokoro-voices-1 release, checking every sha256 first.
# Assets are never replaced: if the release exists, it does nothing.
name: Publish kokoro-voices-1
on:
  push:
    branches: [claude/project-thread-cr5ht3]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view kokoro-voices-1 >/dev/null 2>&1; then echo "kokoro-voices-1 already exists"; exit 0; fi
          mkdir kokoro-files
          node -e '
            const SOURCE = "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/1939ad2a8e416c0acfeecc08a694d14ef25f2231/";
            const m = require("./src/lib/kokoro-manifest.json");
            const files = { ...m.model };
            for (const v of Object.values(m.voices)) Object.assign(files, v.files);
            for (const [src, sha] of Object.entries(files)) console.log(`${sha}  ${src.split("/").pop()} ${SOURCE}${src}`);
          ' > files.txt
          while read -r sha name url; do
            curl -fsSL -o "kokoro-files/$name" "$url"
            echo "$sha  kokoro-files/$name" | sha256sum -c -
          done < files.txt
          gh release create kokoro-voices-1 kokoro-files/* \
            --title "Kokoro voices 1" \
            --notes "Kokoro-82M (Apache 2.0) 8-bit model, tokenizer and the Heart and Siwis voices, copied unchanged from onnx-community/Kokoro-82M-v1.0-ONNX at revision 1939ad2a8e416c0acfeecc08a694d14ef25f2231 and checked by sha256 (see src/lib/kokoro-manifest.json). Siwis is trained on the SIWIS French Speech Synthesis Database (CC BY 4.0). Never replace these assets: upload a new kokoro-voices-{n} release instead."
