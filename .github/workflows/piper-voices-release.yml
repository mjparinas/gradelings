# One-off: publishes the piper-voices-2 release (Amy + Siwis). Remove after it has run.
name: Publish piper-voices-2
on:
  push:
    branches: [claude/gracious-lamport-qz9qnv]
    paths: [.github/workflows/piper-voices-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view piper-voices-2 >/dev/null 2>&1; then echo "release exists"; exit 0; fi
          mkdir voices && cd voices
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium
          curl -sSLf -O $B/en_US-amy-medium.onnx -O $B/en_US-amy-medium.onnx.json
          gh release download piper-voices-1 --pattern 'fr_FR-siwis-medium*'
          cd ..
          node -e '
            const m=require("./src/lib/piper-manifest.json"),c=require("crypto"),fs=require("fs");
            for (const v of Object.values(m.voices)) for (const [f,h] of Object.entries(v.files)) {
              const got=c.createHash("sha256").update(fs.readFileSync("voices/"+f)).digest("hex");
              if (got!==h) { console.error("hash mismatch",f); process.exit(1); }
            }'
          gh release create piper-voices-2 voices/* --title "Piper voices 2" \
            --notes "Amy (en_US-amy-medium) and Siwis (fr_FR-siwis-medium), copied unchanged from rhasspy/piper-voices."
