# One-off: creates the piper-voices-3 release (the English and French voices from piper-voices-2, unchanged,
# plus the Spanish voice from its pinned rhasspy/piper-voices revision), checking every file's sha256 against
# src/lib/piper-manifest.json first. Does nothing if the release exists; never touches another release's assets.
# Delete this file once the release is made.
name: Mirror piper-voices-3
on:
  push:
    branches: [claude/project-thread-f6wk6w]
    paths: [.github/workflows/mirror-piper-voices-3.yml]
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view piper-voices-3 >/dev/null 2>&1; then echo "piper-voices-3 exists"; exit 0; fi
          mkdir voices
          gh release download piper-voices-2 --dir voices
          es=$(jq -r '.voices.es.source' src/lib/piper-manifest.json)
          for f in $(jq -r '.voices.es.files | keys[]' src/lib/piper-manifest.json); do
            curl -fsSL "$es$f" -o "voices/$f"
          done
          # every voice file in the manifest must be present and match its hash
          jq -r '.voices[].files | to_entries[] | "\(.value)  voices/\(.key)"' src/lib/piper-manifest.json | sha256sum -c -
          # release assets are exactly the manifest's voices (drop anything else piper-voices-2 held)
          want=$(jq -r '.voices[].files | keys[]' src/lib/piper-manifest.json)
          for f in voices/*; do echo "$want" | grep -qx "$(basename "$f")" || rm "$f"; done
          gh release create piper-voices-3 voices/* --title "Piper voices 3" --notes "Amy (English) and Siwis (French), unchanged from piper-voices-2, plus Ald (es_MX Spanish) from rhasspy/piper-voices revision b4e358ffcb232591bf73a540e70f7de528e4174a. Files are checked by sha256 in src/lib/piper-manifest.json."
