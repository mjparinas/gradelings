name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # The admin account scripts/e2e-admin.mjs signs in with (docs/ADMIN.md).
  ADMIN_EMAILS: admin-e2e@example.com
  # The e2e admin has no authenticator app; the unit tests cover the second step (src/server/twoFactor.test.ts).
  ADMIN_2FA: optional

# Everything below runs in parallel. The browser tests only wait for the build, not for the
# quick static checks, so a slow lint never delays them. Every open pull request shares the
# account's limit on machines running at once, so quick checks share a machine rather than each
# taking one. The last job, "CI passed", is the one to require in branch protection: it is green
# only when every other job is.
jobs:
  # Types, lint and the dependency audit are quick, so they share one machine: each job costs
  # about a minute of setup, and every job waits in the same queue as the other open pull requests.
  static:
    name: Types, lint and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx next typegen
      - name: Types
        run: npx tsc --noEmit
      # Each check runs even when the one before it failed, so one run reports them all.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      # Reads the lockfile only. Production dependencies are what ship to families, so they gate the build.
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
      # Dev tooling is reported for visibility but does not block a merge.
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
        continue-on-error: true

  # The unit tests are the longest static check, so they run on three machines at once.
  # scripts/test-shard.mjs deals the files out by weight (scripts/test-weights.json), so the
  # machines finish together, still well before the build. Each one saves a Vitest blob report
  # with its coverage data.
  unit:
    name: Unit and content tests · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run
        run: >-
          node scripts/test-shard.mjs ${{ matrix.shard }}
          --coverage --reporter=default --reporter=blob
          --outputFile.blob=.vitest/blob/blob-$(echo '${{ matrix.shard }}' | tr / -).json
      - uses: actions/upload-artifact@v7
        with:
          name: unit-blob-${{ strategy.job-index }}
          path: .vitest/blob
          retention-days: 1

  # Puts the reports back together: the same line coverage as a single run, written to the run's
  # summary page and, on a pull request, to one comment that is updated each run. It has no
  # threshold yet; e2e scripts are not counted.
  coverage:
    name: Unit test coverage
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: unit-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: npx vitest --mergeReports --coverage
      - run: node scripts/coverage-summary.mjs
      - uses: actions/github-script@v9
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- gradelings-coverage-summary -->';
            const summary = fs.readFileSync('coverage/summary.md', 'utf8').trim();
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            const body = `${marker}\n${summary}\n\n_Updated by [CI run #${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})._`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The static job runs the same type check at the same time (next.config.ts).
      SKIP_BUILD_TYPECHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Next's incremental build cache, so unchanged files aren't compiled again. It is about 2 GB,
      # so only main saves it and pull requests reuse main's: a copy saved on every pull request
      # push filled the repository's 10 GB cache, which then threw out the node_modules and browser
      # caches every job needs.
      - uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # The Supertonic voices (about 265 MB from our supertonic-voices release), so each run doesn't download them again.
      - id: voices
        uses: actions/cache/restore@v6
        with:
          path: public/supertonic
          key: supertonic-${{ hashFiles('src/lib/supertonic-manifest.json', 'package-lock.json') }}
      - run: npm run build
      - if: steps.voices.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: public/supertonic
          key: ${{ steps.voices.outputs.cache-primary-key }}
      # One tar keeps the folder layout exactly as built. The 25 000 prerendered pages are about
      # 5.4 GB and much alike, so zstd with a long window packs them into about 330 MB (the
      # artifact's own zip made 1.5 GB of them, which took the browser jobs up to 6 minutes to
      # download). The voices stay out: the jobs that need them restore them from the cache.
      - run: tar -cf - --exclude=.next/cache .next | zstd -T0 -9 --long=27 -q -o next-build.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: next-build.tar.zst
          compression-level: 0
          retention-days: 1
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  # Device layouts run in the Playwright image: WebKit's system libraries take longer to install
  # on each run than the image takes to pull. The image tag must match the Playwright version in
  # package-lock.json, so bump both together.
  devices:
    name: Browser · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          # 14 device layouts, split over two machines. iPhones and iPads run in real WebKit.
          - { name: "devices 1/2", shard: "1/2" }
          - { name: "devices 2/2", shard: "2/2" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          flavor: playwright
      - uses: actions/download-artifact@v8
        with:
          name: next-build
      - run: scripts/ci-unpack.sh next-build.tar.zst
      - name: Run
        run: scripts/ci-with-server.sh node scripts/e2e-devices.mjs http://localhost:3000 e2e-shots/devices --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-devices-${{ strategy.job-index }}
          path: e2e-shots
          retention-days: 7

  # The Chromium-only checks run on the plain runner, where installing Chromium is quicker than
  # pulling the Playwright image. Each machine runs a few scripts one after another against one
  # server (scripts/ci-each.mjs runs them all and fails if any failed): most scripts take under
  # a minute, while setting up a machine and fetching the build takes one or two, and every
  # machine waits in the queue shared with the other open pull requests.
  browser:
    name: Browser · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Sign-ups are limited to 5 per address in 10 minutes, so keep each group under that
      # (modes 1, classroom 2, sync 2, admin 2) and the admin panel, which switches maintenance
      # mode on and off, last in its group.
      matrix:
        include:
          - name: "accessibility, placement and offline"
            run:
              - "node scripts/e2e-a11y.mjs http://localhost:3000 e2e-shots/a11y"
              - "node scripts/e2e-placement.mjs http://localhost:3000 e2e-shots/placement"
              # Starts and stops its own server on another port, so only the service worker can answer.
              - "node scripts/e2e-offline.mjs"
          - name: "keyboard, playthrough modes and classroom"
            run:
              - "node scripts/e2e-keyboard.mjs http://localhost:3000 e2e-shots/keyboard"
              - "node scripts/e2e.mjs http://localhost:3000 e2e-shots --part modes"
              - "node scripts/e2e-classroom.mjs http://localhost:3000 e2e-shots/classroom"
          - name: "parent area, sync and admin panel"
            run:
              - "node scripts/e2e.mjs http://localhost:3000 e2e-shots --part parents"
              - "node scripts/e2e.mjs http://localhost:3000 e2e-shots --part sync --offline"
              - "node scripts/e2e-admin.mjs http://localhost:3000 e2e-shots/admin"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
      - run: scripts/ci-unpack.sh next-build.tar.zst
      # The same voices the build was made with (the offline test downloads one).
      - uses: actions/cache/restore@v6
        with:
          path: public/supertonic
          key: supertonic-${{ hashFiles('src/lib/supertonic-manifest.json', 'package-lock.json') }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium
      - name: Run
        env:
          COMMANDS: ${{ toJSON(matrix.run) }}
        run: scripts/ci-with-server.sh node scripts/ci-each.mjs "$COMMANDS"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ strategy.job-index }}
          path: e2e-shots
          retention-days: 7

  passed:
    name: CI passed
    needs: [static, unit, coverage, build, devices, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi
