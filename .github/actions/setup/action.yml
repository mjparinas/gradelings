name: Set up GradeMap
description: Node 22 and the exact locked dependencies, with node_modules cached by lockfile.
inputs:
  flavor:
    description: Cache name for where this runs, so modules built in one environment are not reused in another
    default: host
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
    # Restoring node_modules is much faster than npm ci. A miss falls through to a clean npm ci,
    # and the result is saved straight away rather than when the job ends, so a job that is
    # cancelled by a newer push (or fails) still leaves the cache for the next run.
    - id: modules
      uses: actions/cache/restore@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ inputs.flavor }}-${{ hashFiles('package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      run: npm ci --prefer-offline --no-audit --no-fund
      shell: bash
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
