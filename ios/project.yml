# The iPhone and iPad app (docs/IOS.md). XcodeGen turns this file into Gradelings.xcodeproj:
#
#   brew install xcodegen && cd ios && xcodegen generate && open Gradelings.xcodeproj
#
# The .xcodeproj is generated, so it isn't committed; change this file instead.
name: Gradelings
options:
  bundleIdPrefix: ca.grademap
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # CI sets the build number to the workflow run number, so every upload is higher than the last.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Your Apple team id (developer.apple.com > Membership). CI passes it from the APPLE_TEAM_ID secret.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The site the app opens. Override both for a local server, e.g.
    #   xcodebuild ... APP_ORIGIN=http://localhost:3000 APP_DOMAIN=localhost
    APP_ORIGIN: https://gradelings.com
    APP_DOMAIN: gradelings.com

targets:
  Gradelings:
    type: application
    platform: iOS
    sources:
      - path: Gradelings
        excludes: [NativeBridge.js]
      # Read at runtime by WebViewController, so it is copied into the app, not compiled.
      - path: Gradelings/NativeBridge.js
        buildPhase: resources
    settings:
      base:
        # Must match the App Store Connect record. It can never change once the app is published.
        PRODUCT_BUNDLE_IDENTIFIER: ca.grademap.app
        PRODUCT_NAME: Gradelings
        # 1 = iPhone, 2 = iPad: one universal app.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Gradelings/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  GradelingsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GradelingsTests
    dependencies:
      - target: Gradelings
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ca.grademap.app.tests

schemes:
  Gradelings:
    build:
      targets:
        Gradelings: all
        GradelingsTests: [test]
    test:
      config: Debug
      targets:
        - GradelingsTests
    archive:
      config: Release
